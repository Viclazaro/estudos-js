<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 01 - Introdução ao JavaScript</title>
    <style>
        body{
            background-color: rgb(77, 182, 243);
            color:aliceblue;
            font: normal 15pt Times;
        }
        h1{
            color: blueviolet;

        }
    </style>

</head>
<body>
    <h1>Olá mundo!</h1>
    <p>Este é o meu primeiro programa em JavaScript.</p>
    <script>
       var n1 = Number.parseInt(window.prompt('Digite um numero: '));
       var n2 = Number.parseFloat(window.prompt('Digite outro numero: ')); //ou use apenas Number o js vai entender o tipo de dado que vier
       
       var soma = n1 + n2; 
        alert(`A soma entre ${n1} e ${n2} é: ${soma} `);

    </script>
</body>
</html>
