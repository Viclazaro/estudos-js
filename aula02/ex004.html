<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(51, 8, 172);
            font: normal 15pt Times;
            
        }
    </style>
</head>
<body>
    <script>
        var nome = prompt('Qual seu nome?');
        document.write(`seu nome tem ${nome.length} letras <br/>`);
        document.write(`seu nome é ${nome.toUpperCase()} letras <br/>`);
        document.write(`seu nome é ${nome.toLowerCase()} letras`);
    </script>
</body>
</html>
